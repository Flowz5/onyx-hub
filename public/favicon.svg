<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fond sombre circulaire pour le favicon -->
  <rect width="100" height="100" rx="22" fill="#000000"/>
  
  <!-- Anneau hexagonal extérieur discret -->
  <polygon points="50,14 81,32 81,68 50,86 19,68 19,32" stroke="#14213D" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- Pierre d'Onyx à facettes géométriques -->
  <!-- Facette supérieure dorée -->
  <polygon points="50,22 74,36 50,48 26,36" fill="#FCA311" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Facette inférieure gauche (bleu prusse profond) -->
  <polygon points="26,36 50,48 50,78 26,64" fill="#14213D" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Facette inférieure droite (noir onyx) -->
  <polygon points="74,36 50,48 50,78 74,64" fill="#0A0E17" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Pointe basse taillée -->
  <polygon points="50,48 50,78 50,60" stroke="#FCA311" stroke-width="1.5" opacity="0.8"/>
  <circle cx="50" cy="48" r="2.5" fill="#FFFFFF"/>
</svg>