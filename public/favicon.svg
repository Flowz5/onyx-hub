<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100" fill="none">
  <!-- Fond sombre arrondi contrasté pour la barre d'onglets du navigateur -->
  <rect width="100" height="100" rx="22" fill="#0E1626"/>
  
  <!-- Anneau hexagonal de structure architectural -->
  <polygon points="50,14 81,32 81,68 50,86 19,68 19,32" stroke="#14213D" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Pierre d'Onyx à facettes géométriques -->
  <!-- Facette supérieure dorée -->
  <polygon points="50,22 74,36 50,48 26,36" fill="#FCA311" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Facette inférieure gauche (bleu prusse profond) -->
  <polygon points="26,36 50,48 50,78 26,64" fill="#14213D" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Facette inférieure droite (noir onyx) -->
  <polygon points="74,36 50,48 50,78 74,64" fill="#000000" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Ligne de crête et pointe centrale lumineuse -->
  <line x1="50" y1="48" x2="50" y2="78" stroke="#FCA311" stroke-width="2"/>
  <circle cx="50" cy="48" r="3" fill="#FFFFFF"/>
</svg>